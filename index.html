<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇬🇧 English Lessons</title>
    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            padding: 20px;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== ХЕДЕР ===== */
        header {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 50%, #2c3e50 100%);
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '🇬🇧';
            position: absolute;
            right: 20px;
            top: -10px;
            font-size: 100px;
            opacity: 0.1;
        }

        header h1 {
            font-size: 2.2em;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        header h1 .flag {
            font-size: 0.9em;
        }

        header h1 small {
            font-size: 0.35em;
            opacity: 0.8;
            font-weight: normal;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .header-stats {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.95em;
            display: flex;
            gap: 25px;
            align-items: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-stats .loading {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== ПОИСК ===== */
        .search-bar {
            padding: 18px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 22px;
            border: 2px solid #dee2e6;
            border-radius: 14px;
            font-size: 1em;
            transition: all 0.3s ease;
            min-width: 200px;
            background: white;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #c0392b;
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.1);
        }

        .search-bar input::placeholder {
            color: #999;
        }

        .search-bar .view-toggle {
            display: flex;
            gap: 8px;
        }

        .search-bar .view-toggle button {
            padding: 10px 18px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .search-bar .view-toggle button:hover {
            background: #fde8e8;
            border-color: #c0392b;
        }

        .search-bar .view-toggle button.active {
            background: #c0392b;
            color: white;
            border-color: #c0392b;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            display: flex;
            flex: 1;
            min-height: 60vh;
        }

        /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
        .sidebar {
            width: 280px;
            background: #fafafa;
            padding: 20px;
            border-right: 2px solid #e9ecef;
            overflow-y: auto;
            max-height: 70vh;
            flex-shrink: 0;
        }

        .sidebar h2 {
            color: #2c3e50;
            font-size: 1.1em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #c0392b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar h2 .count {
            font-size: 0.8em;
            background: #e9ecef;
            padding: 2px 12px;
            border-radius: 20px;
            color: #666;
        }

        .class-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 6px;
            background: white;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 0.95em;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            font-weight: 500;
        }

        .class-btn:hover {
            background: #fde8e8;
            border-color: #e9ecef;
            transform: translateX(4px);
        }

        .class-btn.active {
            background: #c0392b;
            color: white;
            border-color: #c0392b;
            box-shadow: 0 4px 20px rgba(192, 57, 43, 0.3);
        }

        .class-btn .badge {
            float: right;
            background: #e9ecef;
            color: #666;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 0.75em;
        }

        .class-btn.active .badge {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .class-btn .class-icon {
            margin-right: 10px;
            font-size: 1.2em;
        }

        /* ===== ОБЛАСТЬ С УРОКАМИ ===== */
        .content {
            flex: 1;
            padding: 25px 30px;
            overflow-y: auto;
            max-height: 70vh;
            background: white;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 10px;
        }

        .content-header h2 {
            color: #2c3e50;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-header h2 .class-flag {
            font-size: 0.8em;
        }

        .content-header .subtitle {
            color: #666;
            font-size: 0.95em;
        }

        /* ===== СЕТКА УРОКОВ ===== */
        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .lessons-grid.list-view {
            grid-template-columns: 1fr;
        }

        .lesson-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: #333;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .lesson-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #c0392b, #e74c3c, #2c3e50);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lesson-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(192, 57, 43, 0.15);
            border-color: #c0392b;
        }

        .lesson-card:hover::before {
            opacity: 1;
        }

        .lesson-card .icon {
            font-size: 2.4em;
            margin-bottom: 8px;
            display: block;
        }

        .lesson-card h3 {
            font-size: 1em;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .lesson-card .file-name {
            color: #999;
            font-size: 0.7em;
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 2px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 8px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lesson-card .open-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            font-size: 0.8em;
            color: #c0392b;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lesson-card:hover .open-hint {
            opacity: 1;
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading-state .spinner {
            font-size: 4em;
            display: block;
            animation: spin 2s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-state h3 {
            color: #333;
            margin-bottom: 8px;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 8px;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid #e9ecef;
                max-height: 180px;
                padding: 15px;
            }

            .sidebar .class-list {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .sidebar .class-btn {
                width: auto;
                flex: 0 0 auto;
                padding: 8px 16px;
                margin-bottom: 0;
                font-size: 0.85em;
            }

            .sidebar .class-btn .badge {
                display: none;
            }

            .content {
                max-height: none;
                padding: 20px;
            }

            header {
                padding: 18px 20px;
            }

            header h1 {
                font-size: 1.5em;
            }

            .header-stats {
                font-size: 0.75em;
                padding: 6px 14px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .search-bar {
                padding: 15px 20px;
                flex-direction: column;
            }

            .content-header h2 {
                font-size: 1.4em;
            }

            .lessons-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            .lessons-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.2em;
            }

            .header-stats {
                font-size: 0.7em;
                flex-direction: column;
                gap: 4px;
                align-items: flex-start;
            }
        }

        /* ===== АНИМАЦИЯ ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lesson-card {
            animation: fadeIn 0.4s ease;
        }

        /* ===== СКРОЛЛ ===== */
        .sidebar::-webkit-scrollbar,
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track,
        .content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .content::-webkit-scrollbar-thumb {
            background: #c0392b;
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .content::-webkit-scrollbar-thumb:hover {
            background: #a93226;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== ХЕДЕР ===== -->
        <header>
            <h1>
                <span class="flag">🇬🇧</span> English Lessons
                <small>Автоматическое сканирование</small>
            </h1>
            <div class="header-stats">
                <span>📖 <span id="totalLessons">0</span> уроков</span>
                <span>📂 <span id="totalClasses">0</span> классов</span>
                <span id="scanStatus" style="opacity:0.7;">🔄 Сканирование...</span>
            </div>
        </header>

        <!-- ===== ПОИСК ===== -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по теме...">
            <div class="view-toggle">
                <button id="gridViewBtn" class="active" title="Сетка">📐</button>
                <button id="listViewBtn" title="Список">📋</button>
            </div>
        </div>

        <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
        <div class="main-content">
            <!-- Боковая панель -->
            <div class="sidebar">
                <h2>
                    🎓 Классы
                    <span class="count" id="classCount">0</span>
                </h2>
                <div class="class-list" id="classList"></div>
            </div>

            <!-- Область с уроками -->
            <div class="content" id="contentArea">
                <div class="loading-state">
                    <span class="spinner">🔄</span>
                    <h3>Сканирование папок...</h3>
                    <p>Поиск папок grade1 - grade6 и HTML-файлов в них</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  🔍 АВТОМАТИЧЕСКОЕ СКАНИРОВАНИЕ ПАПОК
        // ================================================================

        // Глобальные переменные
        let lessonsData = {};
        let activeClass = null;
        let currentView = 'grid';

        // Иконки для классов
        const classEmojis = {
            'Grade 1': '⭐',
            'Grade 2': '🌟',
            'Grade 3': '✨',
            'Grade 4': '💫',
            'Grade 5': '⭐',
            'Grade 6': '🌟',
        };

        // Иконки для уроков (по умолчанию)
        const defaultIcons = ['📘', '📗', '📙', '📕', '📒', '📓', '📔', '📚', '📖', '🔤', '🎨', '🧮', '✏️', '📐', '📊', '📈', '📉',
            '🎯', '💡', '📝'
        ];

        // Набор эмодзи для разных типов уроков
        const topicEmojis = {
            'alphabet': '🔤',
            'abc': '🔤',
            'colors': '🎨',
            'colours': '🎨',
            'family': '👨‍👩‍👧',
            'animals': '🐱',
            'food': '🍎',
            'numbers': '🔢',
            'body': '🧍',
            'clothes': '👕',
            'weather': '☀️',
            'school': '🏫',
            'house': '🏠',
            'shopping': '🛍️',
            'time': '⏰',
            'hobbies': '🎨',
            'transport': '🚗',
            'sports': '⚽',
            'grammar': '📝',
            'reading': '📖',
            'vocabulary': '📚',
            'writing': '✍️',
            'speaking': '🎤',
            'listening': '🎧',
            'test': '📋',
            'quiz': '📋',
            'exam': '📋',
            'homework': '📓',
            'project': '📁',
            'presentation': '📊',
            'conversation': '🗣️',
            'pronunciation': '🔊',
            'phrasal': '🔗',
            'idioms': '💡',
            'culture': '🏛️',
            'literature': '📜',
            'poetry': '📜',
            'essay': '✍️',
            'business': '💼',
            'travel': '✈️',
        };

        // ================================================================
        //  🎯 ФУНКЦИЯ ПРЕОБРАЗОВАНИЯ ИМЕНИ ФАЙЛА В НАЗВАНИЕ
        // ================================================================

        function formatLessonName(filename) {
            // Убираем расширение
            let name = filename.replace(/\.html$/i, '');

            // Заменяем _ и - на пробелы
            name = name.replace(/[_-]/g, ' ');

            // Разбиваем на слова и каждое делаем с большой буквы
            const words = name.split(' ');
            const formatted = words.map(word => {
                // Оставляем в верхнем регистре сокращения (например, ABC, IELTS)
                if (word === word.toUpperCase() && word.length > 1) {
                    return word;
                }
                // Первая буква заглавная, остальные строчные
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');

            return formatted;
        }

        // ================================================================
        //  🎨 ФУНКЦИЯ ВЫБОРА ИКОНКИ ДЛЯ УРОКА
        // ================================================================

        function getIconForLesson(filename, index) {
            const name = filename.toLowerCase();

            // Ищем ключевые слова в названии
            for (const [key, emoji] of Object.entries(topicEmojis)) {
                if (name.includes(key)) {
                    return emoji;
                }
            }

            // Если ничего не подошло, берём по индексу
            return defaultIcons[index % defaultIcons.length];
        }

        // ================================================================
        //  📂 ФУНКЦИЯ СКАНИРОВАНИЯ ПАПОК
        // ================================================================

        async function scanFolders() {
            const statusEl = document.getElementById('scanStatus');
            const contentArea = document.getElementById('contentArea');

            try {
                statusEl.textContent = '🔄 Сканирование...';
                statusEl.classList.add('loading');

                // Папки которые ищем
                const gradeFolders = [];
                for (let i = 1; i <= 6; i++) {
                    gradeFolders.push(`grade${i}`);
                }

                const foundData = {};

                // Для каждой папки пытаемся получить список файлов
                for (const folder of gradeFolders) {
                    try {
                        // Пытаемся получить список файлов в папке через index
                        const response = await fetch(`${folder}/`);
                        if (!response.ok) {
                            // Если папки нет, пропускаем
                            continue;
                        }

                        const html = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');

                        // Ищем все ссылки на HTML файлы
                        const links = doc.querySelectorAll('a');
                        const htmlFiles = [];

                        links.forEach(link => {
                            const href = link.getAttribute('href');
                            if (href && href.endsWith('.html') && !href.startsWith('/') && !href.startsWith('http')) {
                                // Проверяем, что это файл, а не папка
                                const isFile = !href.endsWith('/');
                                if (isFile) {
                                    // Убираем возможные параметры
                                    const cleanHref = href.split('?')[0].split('#')[0];
                                    if (!htmlFiles.includes(cleanHref)) {
                                        htmlFiles.push(cleanHref);
                                    }
                                }
                            }
                        });

                        // Если файлы найдены, добавляем класс
                        if (htmlFiles.length > 0) {
                            // Сортируем файлы по алфавиту
                            htmlFiles.sort();

                            const className = `Grade ${folder.replace('grade', '')}`;
                            foundData[className] = [];

                            htmlFiles.forEach((file, index) => {
                                const displayName = formatLessonName(file);
                                const icon = getIconForLesson(file, index);

                                foundData[className].push({
                                    name: displayName,
                                    file: `${folder}/${file}`,
                                    icon: icon,
                                    originalFile: file
                                });
                            });
                        }

                    } catch (e) {
                        // Папка не существует или нет доступа
                        console.log(`Папка ${folder} не найдена или пуста`);
                        continue;
                    }
                }

                // Если ничего не найдено, проверяем альтернативный способ
                if (Object.keys(foundData).length === 0) {
                    // Пробуем через прямой запрос к каждой папке
                    for (const folder of gradeFolders) {
                        try {
                            // Пытаемся получить список через альтернативный метод
                            const testResponse = await fetch(`${folder}/index.html`);
                            if (testResponse.ok) {
                                // Если есть index.html, значит папка существует
                                // Но нам нужны все файлы, пробуем получить список
                                const dirResponse = await fetch(`${folder}/`);
                                if (dirResponse.ok) {
                                    const html = await dirResponse.text();
                                    const parser = new DOMParser();
                                    const doc = parser.parseFromString(html, 'text/html');
                                    const links = doc.querySelectorAll('a[href$=".html"]');

                                    const htmlFiles = [];
                                    links.forEach(link => {
                                        const href = link.getAttribute('href');
                                        if (href && href.endsWith('.html') && !href.startsWith('/')) {
                                            const cleanHref = href.split('?')[0].split('#')[0];
                                            if (!htmlFiles.includes(cleanHref) && cleanHref !== 'index.html') {
                                                htmlFiles.push(cleanHref);
                                            }
                                        }
                                    });

                                    if (htmlFiles.length > 0) {
                                        const className = `Grade ${folder.replace('grade', '')}`;
                                        foundData[className] = [];
                                        htmlFiles.sort();

                                        htmlFiles.forEach((file, index) => {
                                            const displayName = formatLessonName(file);
                                            const icon = getIconForLesson(file, index);
                                            foundData[className].push({
                                                name: displayName,
                                                file: `${folder}/${file}`,
                                                icon: icon,
                                                originalFile: file
                                            });
                                        });
                                    }
                                }
                            }
                        } catch (e) {
                            continue;
                        }
                    }
                }

                // Сохраняем данные
                lessonsData = foundData;

                // Обновляем статус
                const totalLessons = Object.values(lessonsData).reduce((sum, arr) => sum + arr.length, 0);
                const totalClasses = Object.keys(lessonsData).length;

                document.getElementById('totalLessons').textContent = totalLessons;
                document.getElementById('totalClasses').textContent = totalClasses;

                if (totalClasses > 0) {
                    statusEl.textContent = `✅ Найдено ${totalClasses} классов, ${totalLessons} уроков`;
                    statusEl.classList.remove('loading');
                } else {
                    statusEl.textContent = '⚠️ Папки grade1-grade6 не найдены';
                    statusEl.classList.remove('loading');

                    // Показываем инструкцию
                    contentArea.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📂</span>
                            <h3>Папки не найдены</h3>
                            <p>Создайте папки <strong>grade1</strong> - <strong>grade6</strong> в одной директории с этим файлом</p>
                            <p style="font-size:0.9em; margin-top:10px; color:#999;">
                                📁 grade1/<br>
                                📁 grade2/<br>
                                📁 grade3/<br>
                                📁 grade4/<br>
                                📁 grade5/<br>
                                📁 grade6/
                            </p>
                            <p style="font-size:0.9em; margin-top:10px; color:#999;">
                                В каждой папке поместите HTML-файлы уроков
                            </p>
                        </div>
                    `;
                    return;
                }

                // Отображаем
                renderAll();

            } catch (e) {
                console.error('Ошибка сканирования:', e);
                statusEl.textContent = '❌ Ошибка сканирования';
                statusEl.classList.remove('loading');

                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">❌</span>
                        <h3>Ошибка сканирования</h3>
                        <p>Проверьте, что папки существуют и доступны</p>
                        <p style="font-size:0.9em; margin-top:10px; color:#999;">
                            ${e.message}
                        </p>
                    </div>
                `;
            }
        }

        // ================================================================
        //  🎨 ОТРИСОВКА ИНТЕРФЕЙСА
        // ================================================================

        function renderAll() {
            renderClasses();
            updateStats();

            // Если есть активный класс, показываем его
            if (activeClass && lessonsData[activeClass]) {
                renderLessons(activeClass);
            } else {
                // Иначе показываем первый класс
                const firstClass = Object.keys(lessonsData)[0];
                if (firstClass) {
                    activeClass = firstClass;
                    renderLessons(firstClass);
                    renderClasses();
                }
            }
        }

        function renderClasses() {
            const classListEl = document.getElementById('classList');
            const classNames = Object.keys(lessonsData);

            if (classNames.length === 0) {
                classListEl.innerHTML = `
                    <div style="text-align:center; padding:20px; color:#999; font-size:0.9em;">
                        <div style="font-size:2em; margin-bottom:10px;">📭</div>
                        Нет классов
                    </div>
                `;
                return;
            }

            // Сортируем классы по номеру
            classNames.sort((a, b) => {
                const numA = parseInt(a.match(/\d+/)?.[0] || 99);
                const numB = parseInt(b.match(/\d+/)?.[0] || 99);
                return numA - numB;
            });

            classListEl.innerHTML = classNames.map(className => {
                const count = lessonsData[className].length;
                const emoji = classEmojis[className] || '🎓';
                return `
                    <button class="class-btn ${activeClass === className ? 'active' : ''}" 
                            data-class="${className}">
                        <span class="class-icon">${emoji}</span>
                        ${className}
                        <span class="badge">${count}</span>
                    </button>
                `;
            }).join('');

            // Обработчики кликов
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const className = this.dataset.class;
                    activeClass = className;
                    renderClasses();
                    renderLessons(className);
                });
            });

            document.getElementById('classCount').textContent = classNames.length;
        }

        function renderLessons(className) {
            const contentArea = document.getElementById('contentArea');
            const lessons = lessonsData[className];

            if (!lessons || lessons.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <h3>Нет уроков</h3>
                        <p>В папке ${className.toLowerCase().replace(' ', '')} нет HTML-файлов</p>
                    </div>
                `;
                return;
            }

            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = lessons.filter(lesson =>
                lesson.name.toLowerCase().includes(searchTerm) ||
                lesson.originalFile.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        <h3>Ничего не найдено</h3>
                        <p>Попробуйте изменить поисковый запрос</p>
                    </div>
                `;
                return;
            }

            const viewClass = currentView === 'list' ? 'list-view' : '';
            const emoji = classEmojis[className] || '🎓';
            const gradeNum = parseInt(className.match(/\d+/)?.[0] || '');
            const flag = gradeNum <= 3 ? '🇬🇧' : '🇺🇸';

            const lessonsHtml = filtered.map((lesson, index) => {
                // Определяем тип урока по названию файла
                let type = '📄 Lesson';
                const nameLower = lesson.originalFile.toLowerCase();
                if (nameLower.includes('grammar')) type = '📝 Grammar';
                else if (nameLower.includes('reading')) type = '📖 Reading';
                else if (nameLower.includes('vocabulary') || nameLower.includes('vocab')) type = '📚 Vocabulary';
                else if (nameLower.includes('writing')) type = '✍️ Writing';
                else if (nameLower.includes('speaking')) type = '🎤 Speaking';
                else if (nameLower.includes('listening')) type = '🎧 Listening';
                else if (nameLower.includes('test') || nameLower.includes('quiz') || nameLower.includes('exam')) type =
                    '📋 Test';
                else if (nameLower.includes('project')) type = '📁 Project';

                return `
                    <a href="${lesson.file}" class="lesson-card" target="_blank" style="animation-delay: ${index * 0.03}s">
                        <span class="icon">${lesson.icon || '📄'}</span>
                        <h3>${lesson.name}</h3>
                        <span style="font-size:0.75em; color:#999;">${type}</span>
                        <br>
                        <span class="file-name">📎 ${lesson.originalFile}</span>
                        <span class="open-hint">→</span>
                    </a>
                `;
            }).join('');

            contentArea.innerHTML = `
                <div class="content-header">
                    <h2>
                        <span class="class-flag">${flag}</span>
                        ${emoji} ${className}
                    </h2>
                    <span class="subtitle">${filtered.length} из ${lessons.length} уроков</span>
                </div>
                <div class="lessons-grid ${viewClass}" id="lessonsGrid">
                    ${lessonsHtml}
                </div>
            `;
        }

        function updateStats() {
            let totalLessons = 0;
            Object.values(lessonsData).forEach(arr => totalLessons += arr.length);
            document.getElementById('totalLessons').textContent = totalLessons;
            document.getElementById('totalClasses').textContent = Object.keys(lessonsData).length;
        }

        // ================================================================
        //  🔍 ПОИСК И ВИД
        // ================================================================

        document.getElementById('searchInput').addEventListener('input', function() {
            if (activeClass && lessonsData[activeClass]) {
                renderLessons(activeClass);
            }
        });

        document.getElementById('gridViewBtn').addEventListener('click', function() {
            currentView = 'grid';
            this.classList.add('active');
            document.getElementById('listViewBtn').classList.remove('active');
            if (activeClass && lessonsData[activeClass]) {
                renderLessons(activeClass);
            }
        });

        document.getElementById('listViewBtn').addEventListener('click', function() {
            currentView = 'list';
            this.classList.add('active');
            document.getElementById('gridViewBtn').classList.remove('active');
            if (activeClass && lessonsData[activeClass]) {
                renderLessons(activeClass);
            }
        });

        // ================================================================
        //  🚀 ЗАПУСК СКАНИРОВАНИЯ
        // ================================================================

        // Запускаем сканирование при загрузке
        scanFolders();

        // Повторное сканирование по кнопке (скрытая функция)
        document.addEventListener('dblclick', function(e) {
            if (e.target.tagName === 'H1') {
                document.getElementById('scanStatus').textContent = '🔄 Повторное сканирование...';
                scanFolders();
            }
        });

        console.log('%c🇬🇧 ENGLISH LESSONS - АВТОМАТИЧЕСКОЕ СКАНИРОВАНИЕ', 'font-size: 20px; font-weight: bold; color: #c0392b;');
        console.log('%c📁 СТРУКТУРА ПАПОК:', 'font-size: 14px; font-weight: bold;');
        console.log('Создайте папки в одной директории с этим файлом:');
        console.log('  📁 grade1/  ← сюда кладите файлы для 1 класса');
        console.log('  📁 grade2/  ← сюда кладите файлы для 2 класса');
        console.log('  📁 grade3/  ← сюда кладите файлы для 3 класса');
        console.log('  📁 grade4/  ← сюда кладите файлы для 4 класса');
        console.log('  📁 grade5/  ← сюда кладите файлы для 5 класса');
        console.log('  📁 grade6/  ← сюда кладите файлы для 6 класса');
        console.log('');
        console.log('%c📝 ИМЕНА ФАЙЛОВ:', 'font-size: 14px; font-weight: bold;');
        console.log('Файлы автоматически преобразуются:');
        console.log('  alphabet_colors.html → Alphabet Colors');
        console.log('  my_family.html → My Family');
        console.log('  present_simple_tense.html → Present Simple Tense');
        console.log('');
        console.log('🔄 Двойной клик на заголовке "English Lessons" - повторное сканирование');
    </script>

</body>
</html>

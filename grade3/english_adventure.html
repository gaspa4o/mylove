<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Adventure — 3 класс • Повторение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #F5EFE0;
  --bg-2: #FAF6EC;
  --beige: #E8DCC4;
  --beige-dark: #C9B998;
  --beige-light: #F0E7D4;
  --blue: #4A90C2;
  --blue-dark: #2C5F8D;
  --blue-light: #A7D0F0;
  --blue-soft: #D9EAF7;
  --text: #2C3E50;
  --text-soft: #5A6E80;
  --white: #FFFFFF;
  --success: #6FAE5C;
  --error: #E07A5F;
  --shadow: 0 6px 20px rgba(44, 95, 141, 0.12);
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: 
    radial-gradient(circle at 10% 10%, rgba(167, 208, 240, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(232, 220, 196, 0.4) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(217, 234, 247, 0.15) 0%, transparent 50%);
  background-attachment: fixed;
  overflow-x: hidden;
}

.cloud {
  position: fixed;
  opacity: 0.55;
  pointer-events: none;
  z-index: 0;
  animation: floatCloud 30s linear infinite;
}
.cloud-1 { top: 5%; left: -10%; width: 140px; }
.cloud-2 { top: 20%; right: -10%; width: 110px; animation-duration: 40s; animation-direction: reverse; }
.cloud-3 { bottom: 15%; left: -10%; width: 100px; animation-duration: 35s; }
@keyframes floatCloud {
  from { transform: translateX(0); }
  to { transform: translateX(120vw); }
}

.app { max-width: 1400px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
  color: white;
  padding: 22px 32px;
  border-radius: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -60%;
  right: -40px;
  width: 220px;
  height: 220px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -80%;
  left: 20%;
  width: 180px;
  height: 180px;
  background: rgba(232, 220, 196, 0.15);
  border-radius: 50%;
}
.header-left { display: flex; align-items: center; gap: 16px; z-index: 1; position: relative; }
.logo {
  width: 64px; height: 64px;
  background: var(--beige);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  animation: bobbing 3s ease-in-out infinite;
}
@keyframes bobbing {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-5px) rotate(3deg); }
}
.header h1 { font-family: 'Fredoka', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
.header p { font-size: 14px; opacity: 0.9; margin-top: 4px; }
.header-right { display: flex; align-items: center; gap: 14px; z-index: 1; position: relative; }
.progress-summary {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
  padding: 14px 24px;
  border-radius: 22px;
  font-weight: 700;
  font-size: 18px;
  border: 1px solid rgba(255,255,255,0.25);
  font-family: 'Fredoka', sans-serif;
}

.main-wrapper { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }

.sidebar {
  background: var(--white);
  border-radius: 24px;
  padding: 22px;
  box-shadow: var(--shadow);
  height: fit-content;
  position: sticky;
  top: 20px;
  border: 2px solid var(--beige);
}
.sidebar h2 {
  font-family: 'Fredoka';
  color: var(--blue-dark);
  font-size: 18px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 2px dashed var(--beige);
  display: flex; align-items: center; gap: 8px;
}
.topics-list { list-style: none; }
.topic-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 6px;
  transition: all 0.25s;
  background: var(--bg-2);
  border: 2px solid transparent;
}
.topic-item:hover {
  background: var(--blue-soft);
  transform: translateX(4px);
  border-color: var(--blue-light);
}
.topic-item.active {
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  color: white;
  border-color: var(--blue-dark);
  box-shadow: 0 4px 12px rgba(74,144,194,0.4);
}
.topic-item.completed { background: var(--beige-light); border-color: var(--success); }
.topic-emoji { font-size: 22px; width: 30px; text-align: center; }
.topic-name { flex: 1; font-weight: 600; font-size: 14px; }
.check-mark {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--beige-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  color: transparent;
  background: white;
  transition: all 0.3s;
  font-weight: 700;
}
.topic-item.completed .check-mark { background: var(--success); color: white; border-color: var(--success); }
.topic-item.active .check-mark { border-color: rgba(255,255,255,0.5); }

.content {
  background: var(--white);
  border-radius: 24px;
  padding: 30px;
  box-shadow: var(--shadow);
  min-height: 700px;
  border: 2px solid var(--beige);
}

.topic-header { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 2px dashed var(--beige); }
.topic-header h2 {
  font-family: 'Fredoka';
  color: var(--blue-dark);
  font-size: 28px;
  display: flex; align-items: center; gap: 10px;
}
.topic-header p { color: var(--text-soft); font-size: 15px; margin-top: 4px; }

.tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.tab {
  background: var(--bg-2);
  border: 2px solid var(--beige);
  padding: 12px 22px;
  font-family: 'Fredoka';
  font-size: 15px;
  cursor: pointer;
  border-radius: 14px;
  color: var(--text-soft);
  transition: all 0.25s;
  font-weight: 500;
}
.tab:hover { background: var(--blue-soft); border-color: var(--blue-light); }
.tab.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue-dark);
  box-shadow: 0 4px 12px rgba(74,144,194,0.3);
}

.tab-content { display: none; animation: fadeIn 0.4s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.theory-block { font-size: 16px; line-height: 1.6; }
.theory-block > h3 { font-family: 'Fredoka'; color: var(--blue-dark); font-size: 22px; margin-bottom: 14px; }
.theory-block > p { margin-bottom: 16px; }
.rule-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.rule-card {
  background: linear-gradient(135deg, var(--beige-light), var(--bg-2));
  padding: 20px;
  border-radius: 18px;
  border: 2px solid var(--beige);
  text-align: center;
  transition: transform 0.2s;
}
.rule-card:hover { transform: translateY(-3px); }
.rule-icon { font-family: 'Fredoka'; font-weight: 600; color: var(--blue-dark); font-size: 16px; margin-bottom: 10px; }
.rule-form {
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  color: white;
  padding: 10px 22px;
  border-radius: 12px;
  font-family: 'Fredoka';
  font-size: 22px;
  display: inline-block;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px rgba(74,144,194,0.3);
}
.rule-example { font-style: italic; color: var(--text-soft); font-size: 14px; line-height: 1.5; }
.tip-box {
  background: linear-gradient(135deg, var(--blue-soft), var(--bg-2));
  padding: 14px 18px;
  border-radius: 14px;
  border-left: 5px solid var(--blue);
  margin-top: 18px;
  font-size: 15px;
}
.tip-box b { color: var(--blue-dark); }

.vocab-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.vocab-card {
  background: var(--bg-2);
  border: 2px solid var(--beige);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  transition: all 0.25s;
  cursor: pointer;
}
.vocab-card:hover {
  background: var(--blue-soft);
  transform: translateY(-3px);
  border-color: var(--blue);
  box-shadow: 0 6px 14px rgba(74,144,194,0.2);
}
.vocab-word { font-family: 'Fredoka'; font-size: 17px; color: var(--blue-dark); font-weight: 600; }
.vocab-trans { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
.vocab-emoji { font-size: 30px; display: block; margin-bottom: 4px; }

.practice-intro {
  background: var(--blue-soft);
  padding: 14px 18px;
  border-radius: 14px;
  margin-bottom: 18px;
  font-size: 15px;
  border-left: 4px solid var(--blue);
}
.practice-question {
  background: var(--bg-2);
  border: 2px solid var(--beige);
  border-radius: 18px;
  padding: 18px 22px;
  margin-bottom: 12px;
  transition: all 0.3s;
}
.practice-question.correct { background: rgba(111, 174, 92, 0.12); border-color: var(--success); }
.practice-question.wrong { background: rgba(224, 122, 95, 0.12); border-color: var(--error); }
.question-text { font-size: 18px; margin-bottom: 14px; font-weight: 600; color: var(--text); line-height: 1.5; }
.question-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--blue);
  color: white;
  width: 30px; height: 30px;
  border-radius: 50%;
  margin-right: 10px;
  font-family: 'Fredoka';
  font-size: 14px;
  vertical-align: middle;
}
.options { display: flex; gap: 10px; flex-wrap: wrap; }
.option-btn {
  background: white;
  border: 2px solid var(--beige-dark);
  padding: 10px 22px;
  border-radius: 12px;
  font-family: 'Fredoka';
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text);
  font-weight: 500;
}
.option-btn:hover { background: var(--blue-soft); border-color: var(--blue); transform: translateY(-2px); }
.option-btn.selected { background: var(--blue); color: white; border-color: var(--blue-dark); }
.option-btn.correct-answer { background: var(--success); color: white; border-color: var(--success); }
.option-btn.wrong-answer { background: var(--error); color: white; border-color: var(--error); }
.feedback { margin-top: 12px; font-weight: 600; font-size: 15px; display: none; align-items: center; gap: 6px; }
.feedback.show { display: flex; }
.feedback.success { color: var(--success); }
.feedback.error { color: var(--error); }

.action-btn {
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  color: white;
  border: none;
  padding: 14px 32px;
  border-radius: 14px;
  font-family: 'Fredoka';
  font-size: 17px;
  cursor: pointer;
  margin-top: 16px;
  transition: all 0.25s;
  box-shadow: 0 4px 12px rgba(74,144,194,0.3);
}
.action-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(74,144,194,0.4); }
.action-btn.secondary { background: var(--beige); color: var(--blue-dark); box-shadow: none; }
.action-btn.secondary:hover { background: var(--beige-dark); color: white; }

.game-area {
  background: linear-gradient(180deg, var(--bg-2), var(--beige-light));
  border-radius: 20px;
  padding: 24px;
  border: 2px solid var(--beige);
}
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.game-title { font-family: 'Fredoka'; font-size: 22px; color: var(--blue-dark); }
.score-board {
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  color: white;
  padding: 10px 22px;
  border-radius: 22px;
  font-weight: 700;
  font-family: 'Fredoka';
  font-size: 16px;
  box-shadow: 0 4px 10px rgba(74,144,194,0.3);
}
.game-instruction {
  background: var(--blue-soft);
  padding: 12px 18px;
  border-radius: 12px;
  margin-bottom: 18px;
  font-size: 15px;
  border-left: 4px solid var(--blue);
}

.quiz-question {
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  margin-bottom: 16px;
  text-align: center;
  border: 2px solid var(--beige);
}
.quiz-question-text { font-family: 'Fredoka'; font-size: 26px; color: var(--blue-dark); margin-bottom: 22px; line-height: 1.4; }
.quiz-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto; }
.quiz-option {
  background: var(--bg-2);
  border: 3px solid var(--beige-dark);
  padding: 16px 12px;
  border-radius: 14px;
  font-family: 'Fredoka';
  font-size: 19px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  font-weight: 500;
}
.quiz-option:hover:not(.disabled) { border-color: var(--blue); background: var(--blue-soft); transform: scale(1.05); }
.quiz-option.correct { background: var(--success); color: white; border-color: var(--success); }
.quiz-option.incorrect { background: var(--error); color: white; border-color: var(--error); }
.quiz-option.disabled { pointer-events: none; }

.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
.memory-card {
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: white;
  font-family: 'Fredoka';
  font-weight: 600;
  transition: all 0.3s;
  box-shadow: 0 4px 10px rgba(74,144,194,0.3);
  user-select: none;
}
.memory-card:hover:not(.flipped):not(.matched) { transform: scale(1.05); }
.memory-card.flipped { background: var(--beige-light); color: var(--blue-dark); border: 2px solid var(--blue); }
.memory-card.matched { background: var(--success); color: white; cursor: default; box-shadow: 0 4px 10px rgba(111, 174, 92, 0.4); }

.match-game { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 600px; margin: 0 auto; }
.match-column { display: flex; flex-direction: column; gap: 10px; }
.match-item {
  background: white;
  border: 2px solid var(--beige-dark);
  padding: 14px 18px;
  border-radius: 14px;
  cursor: pointer;
  font-family: 'Fredoka';
  font-size: 17px;
  text-align: center;
  transition: all 0.2s;
  font-weight: 500;
}
.match-item:hover:not(.matched) { border-color: var(--blue); background: var(--blue-soft); }
.match-item.selected { background: var(--blue); color: white; border-color: var(--blue-dark); transform: scale(1.03); }
.match-item.matched { background: var(--success); color: white; border-color: var(--success); cursor: default; }
.match-item.wrong { animation: shake 0.4s; border-color: var(--error); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.color-target {
  background: linear-gradient(135deg, var(--blue-soft), white);
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 20px;
  font-family: 'Fredoka';
  font-size: 24px;
  color: var(--blue-dark);
  border: 2px dashed var(--blue);
}
.color-target b { background: var(--blue); color: white; padding: 6px 22px; border-radius: 14px; font-size: 28px; margin-left: 8px; }
.color-game-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; max-width: 700px; margin: 0 auto; }
.color-swatch {
  height: 110px;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.25s;
  border: 4px solid transparent;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.color-swatch:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.color-swatch.correct { box-shadow: 0 0 0 4px var(--success), 0 8px 20px rgba(111,174,92,0.4); transform: scale(1.08); }
.color-swatch.wrong { box-shadow: 0 0 0 4px var(--error); animation: shake 0.4s; }

.math-question { background: white; padding: 36px; border-radius: 18px; text-align: center; margin-bottom: 16px; border: 2px solid var(--beige); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
.math-expr { font-family: 'Fredoka'; font-size: 48px; color: var(--blue-dark); margin-bottom: 24px; font-weight: 600; }
.math-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto; }

.sort-game { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
.sort-bin {
  background: var(--bg-2);
  border: 3px dashed var(--beige-dark);
  border-radius: 16px;
  padding: 12px;
  min-height: 230px;
  transition: all 0.2s;
  cursor: pointer;
}
.sort-bin.hover { border-color: var(--blue); background: var(--blue-soft); }
.sort-bin-title {
  font-family: 'Fredoka';
  text-align: center;
  margin-bottom: 12px;
  padding: 10px;
  border-radius: 10px;
  color: white;
  font-size: 18px;
}
.sort-bin.spring .sort-bin-title { background: #88C270; }
.sort-bin.summer .sort-bin-title { background: #F4B860; }
.sort-bin.autumn .sort-bin-title { background: #E8A24A; }
.sort-bin.winter .sort-bin-title { background: #6FA8DC; }
.bin-content { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 80px; }
.sort-items {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 14px 0;
  padding: 14px;
  background: white;
  border-radius: 14px;
  border: 2px solid var(--beige);
  min-height: 70px;
}
.sort-item {
  background: var(--bg-2);
  border: 2px solid var(--beige-dark);
  padding: 10px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Fredoka';
  font-size: 16px;
  transition: all 0.2s;
  font-weight: 500;
}
.sort-item:hover { background: var(--blue-soft); border-color: var(--blue); }
.sort-item.selected { background: var(--blue); color: white; border-color: var(--blue-dark); transform: scale(1.05); }
.sort-item.placed { background: var(--success); color: white; border-color: var(--success); cursor: default; }

.weather-scene {
  background: linear-gradient(135deg, var(--blue-soft), var(--beige-light));
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 18px;
  min-height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 75px;
  border: 2px solid var(--beige);
}
.weather-description { font-family: 'Fredoka'; font-size: 22px; color: var(--blue-dark); margin-bottom: 18px; text-align: center; font-style: italic; }

/* === ИГРА: TrueFalse (Can/Can't) === */
.tf-scene {
  background: linear-gradient(135deg, var(--blue-soft), var(--beige-light));
  border-radius: 20px;
  padding: 36px 20px;
  margin-bottom: 18px;
  text-align: center;
  border: 2px solid var(--beige);
}
.tf-emoji-pair {
  font-size: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin-bottom: 16px;
  min-height: 110px;
}
.tf-emoji-pair span { animation: bounceIn 0.6s ease; display: inline-block; }
@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); }
}
.tf-sentence {
  font-family: 'Fredoka';
  font-size: 24px;
  color: var(--blue-dark);
  font-weight: 600;
}
.tf-buttons { display: flex; gap: 16px; justify-content: center; max-width: 500px; margin: 0 auto; }
.tf-btn {
  flex: 1;
  padding: 22px 16px;
  border-radius: 18px;
  font-family: 'Fredoka';
  font-size: 22px;
  cursor: pointer;
  border: 4px solid transparent;
  transition: all 0.25s;
  font-weight: 600;
}
.tf-btn:hover:not(.disabled) { transform: translateY(-4px) scale(1.03); }
.tf-btn.yes { background: linear-gradient(135deg, #8BC97A, #6FAE5C); color: white; }
.tf-btn.no { background: linear-gradient(135deg, #F09A82, #E07A5F); color: white; }
.tf-btn.disabled { pointer-events: none; opacity: 0.5; }
.tf-btn.correct { box-shadow: 0 0 0 6px var(--success); transform: scale(1.05); }
.tf-btn.wrong { box-shadow: 0 0 0 6px var(--error); animation: shake 0.4s; }
.tf-result {
  text-align: center;
  margin-top: 18px;

// ====== СОСТОЯНИЕ ======
let currentTopicIndex = 0;
let completedTopics = new Set();

// ====== УТИЛИТЫ ======
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function markTopicCompleted(topicId) {
  if (!completedTopics.has(topicId)) {
    completedTopics.add(topicId);
    renderTopicsList();
    updateProgress();
    if (completedTopics.size === topics.length) {
      setTimeout(showFinalScreen, 1500);
    }
  }
}

function updateProgress() {
  document.getElementById('progress-summary').textContent = `🏆 ${completedTopics.size} / 10`;
}

// ====== РЕНДЕР СПИСКА ТЕМ ======
function renderTopicsList() {
  const list = document.getElementById('topics-list');
  list.innerHTML = topics.map((t, i) => `
    <li class="topic-item ${i === currentTopicIndex ? 'active' : ''} ${completedTopics.has(t.id) ? 'completed' : ''}" data-index="${i}">
      <span class="topic-emoji">${t.emoji}</span>
      <span class="topic-name">${i + 1}. ${t.title}</span>
      <span class="check-mark">✓</span>
    </li>
  `).join('');
  list.querySelectorAll('.topic-item').forEach(el => {
    el.addEventListener('click', () => {
      currentTopicIndex = +el.dataset.index;
      renderTopic();
    });
  });
}

// ====== РЕНДЕР ТЕМЫ ======
function renderTopic() {
  const topic = topics[currentTopicIndex];
  document.getElementById('topic-title').textContent = `${topic.emoji} ${topic.title}`;
  document.getElementById('topic-subtitle').textContent = topic.subtitle;
  
  document.getElementById('theory-content').innerHTML = topic.theory;
  renderPractice(topic);
  renderGame(topic);
  
  renderTopicsList();
  
  document.getElementById('prev-btn').disabled = currentTopicIndex === 0;
  document.getElementById('next-btn').disabled = currentTopicIndex === topics.length - 1;
  
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[data-tab="theory"]').classList.add('active');
  document.getElementById('theory-content').classList.add('active');
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ====== РЕНДЕР УПРАЖНЕНИЙ ======
function renderPractice(topic) {
  const container = document.getElementById('practice-content');
  let html = '<div class="practice-intro">📝 Выбери правильный ответ в каждом задании и нажми "Проверить".</div>';
  
  topic.practice.forEach((q, i) => {
    const opts = q.options.length > 3 ? shuffle(q.options) : q.options;
    html += `
      <div class="practice-question" data-index="${i}">
        <div class="question-text">
          <span class="question-number">${i + 1}</span>${q.q}
        </div>
        <div class="options">
          ${opts.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}
        </div>
        <div class="feedback"></div>
      </div>
    `;
  });
  
  html += `<button class="action-btn" id="check-practice">✓ Проверить ответы</button>`;
  container.innerHTML = html;
  
  container.querySelectorAll('.practice-question').forEach(q => {
    q.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        q.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  });
  
  document.getElementById('check-practice').addEventListener('click', () => {
    let allCorrect = true;
    let answered = 0;
    container.querySelectorAll('.practice-question').forEach((qEl, i) => {
      const q = topic.practice[i];
      const selected = qEl.querySelector('.option-btn.selected');
      const feedback = qEl.querySelector('.feedback');
      
      qEl.querySelectorAll('.option-btn').forEach(b => {
        b.classList.remove('correct-answer', 'wrong-answer');
        if (b.dataset.answer === q.answer) b.classList.add('correct-answer');
      });
      
      if (selected) {
        answered++;
        if (selected.dataset.answer === q.answer) {
          qEl.classList.add('correct');
          qEl.classList.remove('wrong');
          feedback.textContent = '✓ Правильно!';
          feedback.className = 'feedback show success';
        } else {
          qEl.classList.add('wrong');
          qEl.classList.remove('correct');
          selected.classList.add('wrong-answer');
          feedback.textContent = `✗ Правильный ответ: ${q.answer}`;
          feedback.className = 'feedback show error';
          allCorrect = false;
        }
      } else {
        qEl.classList.add('wrong');
        feedback.textContent = `? Выбери ответ. Правильный: ${q.answer}`;
        feedback.className = 'feedback show error';
        allCorrect = false;
      }
    });
    
    if (answered === 0) {
      showToast('Сначала ответь на вопросы! ✏️', 'error');
    } else if (allCorrect) {
      markTopicCompleted(topic.id);
      showToast('🎉 Отлично! Тема пройдена!', 'success');
    } else {
      showToast('Есть ошибки. Попробуй ещё раз! 🙈', 'error');
    }
  });
}

// ====== РЕНДЕР ИГРЫ ======
function renderGame(topic) {
  const container = document.getElementById('game-content');
  const game = topic.game;
  container.dataset.gameType = game.type;
  switch (game.type) {
    case 'quiz': renderQuizGame(container, game, topic); break;
    case 'memory': renderMemoryGame(container, game, topic); break;
    case 'match': renderMatchGame(container, game, topic); break;
    case 'color': renderColorGame(container, game, topic); break;
    case 'math': renderMathGame(container, game, topic); break;
    case 'sort': renderSortGame(container, game, topic); break;
    case 'weather': renderWeatherGame(container, game, topic); break;
    case 'truefalse': renderTrueFalseGame(container, game, topic); break;
    case 'lookchoose': renderLookChooseGame(container, game, topic); break;
  }
}

// ====== ИГРА: QUIZ ======
function renderQuizGame(container, game, topic) {
  let score = 0;
  let currentQ = 0;
  
  function showQ() {
    if (currentQ >= game.items.length) {
      container.innerHTML = `
        <div class="completion-screen">
          <div class="emoji-big">${score >= game.items.length * 0.7 ? '🏆' : '💪'}</div>
          <h2>${score >= game.items.length * 0.7 ? 'Молодец!' : 'Хорошая попытка!'}</h2>
          <p>Твой счёт: <b>${score}</b> из <b>${game.items.length}</b></p>
          <button class="action-btn" onclick="renderGame(topics[${currentTopicIndex}])">🔄 Играть снова</button>
        </div>
      `;
      if (score >= Math.ceil(game.items.length * 0.7)) {
        markTopicCompleted(topic.id);
      }
      return;
    }
    const item = game.items[currentQ];
    container.innerHTML = `
      <div class="game-area">
        <div class="game-header">
          <div class="game-title">${game.title}</div>
          <div class="score-board">⭐ ${score} / ${game.items.length}</div>
        </div>
        <div class="game-instruction">Выбери правильный ответ:</div>
        <div class="quiz-question">
          <div class="quiz-question-text">${item.q}</div>
          <div class="quiz-options">
            ${item.options.map((opt, i) => `<div class="quiz-option" data-i="${i}">${opt}</div>`).join('')}
          </div>
        </div>
        <p style="text-align:center;color:var(--text-soft);font-family:'Fredoka';">Вопрос ${currentQ + 1} из ${game.items.length}</p>
      </div>
    `;
    container.querySelectorAll('.quiz-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const i = +opt.dataset.i;
        container.querySelectorAll('.quiz-option').forEach(o => o.classList.add('disabled'));
        if (i === item.correct) {
          opt.classList.add('correct');
          score++;
          showToast('✓ Правильно!', 'success');
        } else {
          opt.classList.add('incorrect');
          container.querySelector(`.quiz-option[data-i="${item.correct}"]`).classList.add('correct');
          showToast('✗ Неверно', 'error');
        }
        setTimeout(() => { currentQ++; showQ(); }, 1100);
      });
    });
  }
  showQ();
}

// ====== ИГРА: MEMORY ======
function renderMemoryGame(container, game, topic) {
  const cards = [];
  game.pairs.forEach((p, i) => {
    cards.push({ id: i * 2, pairId: i, content: p.emoji, type: 'emoji' });
    cards.push({ id: i * 2 + 1, pairId: i, content: p.word, type: 'word' });
  });
  const shuffled = shuffle(cards);
  let flipped = [];
  let matched = 0;
  
  container.innerHTML = `
    <div class="game-area">
      <div class="game-header">
        <div class="game-title">${game.title}</div>
        <div class="score-board" id="mem-score">⭐ 0 / ${game.pairs.length}</div>
      </div>
      <div class="game-instruction">Найди пары: слово + картинка. Открой две карточки.</div>
      <div class="memory-grid">
        ${shuffled.map(c => `<div class="memory-card" data-id="${c.id}" data-pair="${c.pairId}">?</div>`).join('')}
      </div>
    </div>
  `;
  
  let lock = false;
  container.querySelectorAll('.memory-card').forEach(card => {
    card.addEventListener('click', () => {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      const id = +card.dataset.id;
      const c = shuffled.find(x => x.id === id);
      card.classList.add('flipped');
      card.textContent = c.content;
      flipped.push({ card, pairId: c.pairId });
      
      if (flipped.length === 2) {
        lock = true;
        if (flipped[0].pairId === flipped[1].pairId) {
          setTimeout(() => {
            flipped.forEach(f => { f.card.classList.add('matched'); f.card.classList.remove('flipped'); });
            flipped = [];
            matched++;

// ====== ИГРА: MATCH ======
function renderMatchGame(container, game, topic) {
  const leftItems = game.pairs.map((p, i) => ({ ...p, idx: i }));
  const rightItems = shuffle(game.pairs.map((p, i) => ({ ...p, idx: i })));
  let selectedLeft = null;
  let matchedCount = 0;
  
  container.innerHTML = `
    <div class="game-area">
      <div class="game-header">
        <div class="game-title">${game.title}</div>
        <div class="score-board" id="match-score">⭐ 0 / ${game.pairs.length}</div>
      </div>
      <div class="game-instruction">Нажми на слово слева, потом на пару справа.</div>
      <div class="match-game">
        <div class="match-column" id="left-col">
          ${leftItems.map(p => `<div class="match-item" data-idx="${p.idx}" data-side="left">${p.left}</div>`).join('')}
        </div>
        <div class="match-column" id="right-col">
          ${rightItems.map(p => `<div class="match-item" data-idx="${p.idx}" data-side="right">${p.right}</div>`).join('')}
        </div>
      </div>
    </div>
  `;
  
  container.querySelectorAll('.match-item').forEach(item => {
    item.addEventListener('click', () => {
      if (item.classList.contains('matched')) return;
      const side = item.dataset.side;
      if (side === 'left') {
        container.querySelectorAll('#left-col .match-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        selectedLeft = item;
      } else {
        if (!selectedLeft) {
          showToast('Сначала выбери слева! 👈', 'error');
          return;
        }
        const leftIdx = +selectedLeft.dataset.idx;
        if (+item.dataset.idx === leftIdx) {
          selectedLeft.classList.add('matched');
          selectedLeft.classList.remove('selected');
          item.classList.add('matched');
          matchedCount++;
          container.querySelector('#match-score').textContent = `⭐ ${matchedCount} / ${game.pairs.length}`;
          selectedLeft = null;
          if (matchedCount === game.pairs.length) {
            showToast('🎉 Все пары найдены!', 'success');
            markTopicCompleted(topic.id);
            setTimeout(() => {
              container.querySelector('.match-game').insertAdjacentHTML('beforebegin', `
                <div class="completion-screen">
                  <div class="emoji-big">🏆</div>
                  <h2>Отлично!</h2>
                  <p>Все пары соединены!</p>
                  <button class="action-btn" onclick="renderGame(topics[${currentTopicIndex}])">🔄 Играть снова</button>
                </div>
              `);
            }, 300);
          }
        } else {
          item.classList.add('wrong');
          setTimeout(() => item.classList.remove('wrong'), 400);
          showToast('✗ Не верно, попробуй ещё!', 'error');
        }
      }
    });
  });
}

// ====== ИГРА: COLOR (БЕЗ НАДПИСЕЙ НА КВАДРАТАХ) ======
function renderColorGame(container, game, topic) {
  const colors = game.items;
  let score = 0;
  let attempts = 0;
  const maxAttempts = 8;
  let currentTarget = null;
  
  function nextRound() {
    if (attempts >= maxAttempts) {
      const success = score >= Math.ceil(maxAttempts * 0.7);
      container.innerHTML = `
        <div class="completion-screen">
          <div class="emoji-big">${success ? '🎨' : '🖌'}</div>
          <h2>${success ? 'Молодец!' : 'Хорошая попытка!'}</h2>
          <p>Правильных ответов: <b>${score}</b> из <b>${maxAttempts}</b></p>
          <button class="action-btn" onclick="renderGame(topics[${currentTopicIndex}])">🔄 Играть снова</button>
        </div>
      `;
      if (success) markTopicCompleted(topic.id);
      return;
    }
    currentTarget = colors[Math.floor(Math.random() * colors.length)];
    // Показываем 6 случайных цветов, среди которых точно есть нужный
    const otherColors = shuffle(colors.filter(c => c.color !== currentTarget.color)).slice(0, 5);
    const boardColors = shuffle([currentTarget, ...otherColors]);
    
    container.innerHTML = `
      <div class="game-area">
        <div class="game-header">
          <div class="game-title">${game.title}</div>
          <div class="score-board">⭐ ${score} / ${maxAttempts}</div>
        </div>
        <div class="game-instruction">Найди нужный цвет и нажми на него.</div>
        <div class="color-target">Найди цвет: <b>${currentTarget.color}</b></div>
        <div class="color-game-board">
          ${boardColors.map(c => `<div class="color-swatch" style="background:${c.hex}" data-color="${c.color}" title=""></div>`).join('')}
        </div>
      </div>
    `;
    container.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        attempts++;
        if (sw.dataset.color === currentTarget.color) {
          score++;
          sw.classList.add('correct');
          showToast('✓ Правильно!', 'success');
        } else {
          sw.classList.add('wrong');
          showToast('✗ Неверно', 'error');
        }
        setTimeout(nextRound, 700);
      });
    });
  }
  nextRound();
}

// ====== ИГРА: MATH ======
function renderMathGame(container, game, topic) {
  const words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
  let score = 0;
  let current = 0;
  const max = 6;
  
  function generateQuestion() {
    const a = Math.floor(Math.random() * 10) + 1;
    const b = Math.floor(Math.random() * 10) + 1;
    const op = Math.random() > 0.5 ? '+' : '-';
    let result = op === '+' ? a + b : Math.max(a, b) - Math.min(a, b);
    if (result > 20) return generateQuestion();
    const answerWord = words[result];
    const opts = new Set([answerWord]);
    while (opts.size < 4) {
      opts.add(words[Math.floor(Math.random() * 21)]);
    }
    return { expr: `${op === '-' ? Math.max(a, b) : a} ${op} ${op === '-' ? Math.min(a, b) : b}`, answer: answerWord, options: shuffle([...opts]) };
  }
  
  function showQ() {
    if (current >= max) {
      const success = score >= Math.ceil(max * 0.7);
      container.innerHTML = `
        <div class="completion-screen">
          <div class="emoji-big">${success ? '🔢' : '✏️'}</div>
          <h2>${success ? 'Молодец!' : 'Хорошая попытка!'}</h2>
          <p>Правильных ответов: <b>${score}</b> из <b>${max}</b></p>
          <button class="action-btn" onclick="renderGame(topics[${currentTopicIndex}])">🔄 Играть снова</button>
        </div>
      `;
      if (success) markTopicCompleted(topic.id);
      return;
    }
    const q = generateQuestion();
    container.innerHTML = `
      <div class="game-area">
        <div class="game-header">
          <div class="game-title">${game.title}</div>
          <div class="score-board">⭐ ${score} / ${max}</div>
        </div>
        <div class="game-instruction">Реши пример и выбери ответ словом.</div>
        <div class="math-question">
          <div class="math-expr">${q.expr} = ?</div>
          <div class="math-options">
            ${q.options.map(opt => `<div class="quiz-option" data-opt="${opt}">${opt}</div>`).join('')}
          </div>
        </div>
        <p style="text-align:center;color:var(--text-soft);font-family:'Fredoka';">Вопрос ${current + 1} из ${max}</p>
      </div>
    `;
    container.querySelectorAll('.quiz-option').forEach(opt => {
      opt.addEventListener('click', () => {
        current++;
        container.querySelectorAll('.quiz-option').forEach(o => o.classList.add('disabled'));
        if (opt.dataset.opt === q.answer) {
          opt.classList.add('correct');
          score++;
          showToast('✓ Верно!', 'success');
        } else {
          opt.classList.add('incorrect');
          container.querySelector(`.quiz-option[data-opt="${q.answer}"]`)?.classList.add('correct');
          showToast('✗ Неверно', 'error');
        }
        setTimeout(showQ, 1100);
      });
    });
  }
  showQ();
}

// ====== ИГРА: SORT (Сезоны) ======
function renderSortGame(container, game, topic) {
  const items = shuffle(game.items);
  let selected = null;
  let placed = 0;
  
  container.innerHTML = `
    <div class="game-area">
      <div class="game-header">
        <div class="game-title">${game.title}</div>
        <div class="score-board" id="sort-score">⭐ 0 / ${items.length}</div>
      </div>
      <div class="game-instruction">Нажми на слово, потом на время года, к которому оно относится.</div>
      <div class="sort-items" id="sort-items">
        ${items.map((item, i) => `<div class="sort-item" data-idx="${i}" data-season="${item.season}">${item.word}</div>`).join('')}
      </div>
      <div class="sort-game">
        ${['spring','summer','autumn','winter'].map(s => `
          <div class="sort-bin ${s}" data-season="${s}">
            <div class="sort-bin-title">${s === 'spring' ? '🌷' : s === 'summer' ? '☀️' : s === 'autumn' ? '🍂' : '❄️'} ${s}</div>
            <div class="bin-content"></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  container.querySelectorAll('.sort-item').forEach(item => {
    item.addEventListener('click', () => {
      if (item.classList.contains('placed')) return;
      container.querySelectorAll('.sort-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      selected = item;
    });
  });
  
  container.querySelectorAll('.sort-bin').forEach(bin => {
    bin.addEventListener('click', () => {
      if (!selected) {
        showToast('Сначала выбери слово! 👆', 'error');
        return;
      }
      if (selected.dataset.season === bin.dataset.season) {
        bin.querySelector('.bin-content').appendChild(selected);
        selected.classList.add('placed');
        selected.classList.remove('selected');
        placed++;
        container.querySelector('#sort-score').textContent = `⭐ ${placed} / ${items.length}`;
        selected = null;
        if (placed === items.length) {
          showToast('🎉 Всё правильно!', 'success');
          markTopicCompleted(topic.id);
          setTimeout(() => {
            container.querySelector('.sort-game').insertAdjacentHTML('afterend', `
              <div class="completion-screen">
                <div class="emoji-big">🏆</div>
                <h2>Молодец!</h2>
                <p>Все слова распределены правильно!</p>
                <button class="action-btn" onclick="renderGame(topics[${currentTopicIndex}])">🔄 Играть снова</button>
              </div>
            `);
          }, 300);
        }
      } else {
        selected.classList.add('wrong');
        setTimeout(() => selected.classList.remove('wrong'), 400);
        showToast('✗ Не то время года', 'error');
      }
    });
  });
}
